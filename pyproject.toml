[project]
name = "quantum-medical-image-classification"
version = "0.1.0"
description = "Hybrid Quantum-Classical Deep Learning for Medical Image Classification (PneumoniaMNIST)"
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "torch>=2.2.0",
    "torchvision>=0.17.0",
    "pennylane>=0.36.0",
    "medmnist>=3.0.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "pillow>=10.2.0",
    "tensorboard>=2.16.0",
    "pyyaml>=6.0.1",
    "pytest>=8.0.0",
    "tqdm>=4.66.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
